<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELYTRA — Connecting to Tesla</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }
        .container {
            padding: 40px;
            max-width: 400px;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 24px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        h1 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        p {
            font-size: 14px;
            color: rgba(255,255,255,0.5);
            line-height: 1.5;
        }
        .error {
            background: rgba(239,68,68,0.1);
            border: 1px solid rgba(239,68,68,0.3);
            border-radius: 12px;
            padding: 16px;
            margin-top: 20px;
            display: none;
        }
        .error p { color: #ef4444; }
        a {
            color: #3b82f6;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner" id="spinner"></div>
        <h1 id="title">Connecting to Tesla…</h1>
        <p id="subtitle">Redirecting you back to ELYTRA.</p>

        <div class="error" id="error-box">
            <p id="error-message"></p>
        </div>
    </div>

    <script>
        (function() {
            // Extract query parameters from the current URL
            const params = new URLSearchParams(window.location.search);
            const code  = params.get('code');
            const state = params.get('state');
            const error = params.get('error');

            if (error) {
                // Tesla returned an error (user denied, etc.)
                document.getElementById('spinner').style.display = 'none';
                document.getElementById('title').textContent = 'Authorization Failed';
                document.getElementById('subtitle').textContent = '';
                document.getElementById('error-box').style.display = 'block';
                document.getElementById('error-message').textContent =
                    'Tesla returned an error: ' + error + '. Please try again from the ELYTRA app.';
                return;
            }

            if (!code) {
                // No code and no error — something unexpected
                document.getElementById('spinner').style.display = 'none';
                document.getElementById('title').textContent = 'Missing Authorization Code';
                document.getElementById('subtitle').textContent = '';
                document.getElementById('error-box').style.display = 'block';
                document.getElementById('error-message').textContent =
                    'No authorization code was received from Tesla. Please try connecting again from the ELYTRA app.';
                return;
            }

            // Build the custom scheme URL that ASWebAuthenticationSession is listening for
            var deepLink = 'elytra://auth/tesla?code=' + encodeURIComponent(code);
            if (state) {
                deepLink += '&state=' + encodeURIComponent(state);
            }

            // Redirect to the custom scheme — ASWebAuthenticationSession will intercept this
            window.location.replace(deepLink);

            // Fallback: if the redirect doesn't work after 2 seconds, show a manual link
            setTimeout(function() {
                document.getElementById('spinner').style.display = 'none';
                document.getElementById('title').textContent = 'Almost Done';
                document.getElementById('subtitle').innerHTML =
                    'If you are not redirected automatically, ' +
                    '<a href="' + deepLink + '">tap here to return to ELYTRA</a>.';
            }, 2000);
        })();
    </script>
</body>
</html>
